name: Release HACS version

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bundle frontend
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main_path = Path("hassio-3d-print-calculator.js")
          enhancement_path = Path("calculator-enhancements.js")

          start = "// === 3D CALCULATOR UI ENHANCEMENTS BUNDLE START ==="
          end = "// === 3D CALCULATOR UI ENHANCEMENTS BUNDLE END ==="

          main = main_path.read_text(encoding="utf-8")
          enhancement = enhancement_path.read_text(encoding="utf-8").strip()

          if start in main:
              main = main.split(start, 1)[0].rstrip()

          bundled = (
              main.rstrip()
              + "\n\n"
              + start
              + "\n"
              + enhancement
              + "\n"
              + end
              + "\n"
          )

          main_path.write_text(bundled, encoding="utf-8")
          PY

      - name: Commit bundled frontend
        id: bundle_commit
        run: |
          if git diff --quiet -- hassio-3d-print-calculator.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add hassio-3d-print-calculator.js
            git commit -m "build: bundle calculator frontend"

            # The main branch may have changed after checkout (for example,
            # another manual commit). Rebase the generated commit before push.
            # Retry once if the remote moves again between fetch and push.
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main && git push origin HEAD:main && break

              if [ "$attempt" -eq 3 ]; then
                echo "Failed to push bundled frontend after 3 attempts"
                exit 1
              fi

              git rebase --abort || true
              sleep 2
            done

            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Read version
        id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TARGET_SHA=$(git rev-parse HEAD)

          if gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists"
          else
            gh release create "v${VERSION}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET_SHA" \
              --title "v${VERSION}" \
              --generate-notes
          fi
