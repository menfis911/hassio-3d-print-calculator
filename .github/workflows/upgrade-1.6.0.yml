name: Build 1.6.0
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  upgrade:
    if: github.event.head_commit.message == 'chore: trigger 1.6.0 build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch 1.6.0
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          js = Path('hassio-3d-print-calculator.js')
          s = js.read_text()
          s = s.replace('this.storageKey = "ha-3d-print-calculator";', 'this.version = "1.6.0";\n    this.storageKey = "ha-3d-print-calculator";', 1)
          marker = '.result{position:sticky;top:15px}'
          css = '''.result{position:sticky;top:15px}.result-card{overflow:hidden}.price-hero{padding:20px;border-radius:16px;background:linear-gradient(135deg,var(--primary-color),var(--accent-color,var(--primary-color)));color:#fff;text-align:center;margin:0 0 16px}.price-hero .eyebrow{font-size:12px;opacity:.85;text-transform:uppercase;letter-spacing:.08em}.price-hero .price{font-size:44px;font-weight:900;line-height:1.05;margin:8px 0}.price-hero .per-unit{font-size:14px;opacity:.9}.result-section{padding:14px 0;border-top:1px solid var(--divider-color)}.result-section h3{margin:0 0 10px;font-size:15px}.cost-list{display:grid;gap:4px}.cost-line{display:flex;justify-content:space-between;gap:12px;padding:8px 0}.cost-line .meta{color:var(--secondary-text-color);font-size:12px}.cost-total{display:flex;justify-content:space-between;padding:12px;margin-top:6px;border-radius:10px;background:var(--primary-background-color);font-weight:800}.commercial{display:grid;gap:6px}.commercial-line{display:flex;justify-content:space-between;gap:12px;padding:7px 0}.commercial-line .value{font-weight:700}.explain{padding:11px 12px;border-radius:10px;background:var(--primary-background-color);color:var(--secondary-text-color);font-size:12px;line-height:1.45;margin-top:8px}.field-hint{font-size:11px;color:var(--secondary-text-color);line-height:1.35;margin-top:-2px}.copy-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.copy-grid button{width:100%}.status-inline{min-height:0}.profit-positive{font-size:20px;font-weight:800}.minimum-note{padding:10px;border-radius:10px;background:var(--primary-background-color);font-size:12px;margin-top:8px}'''
          if marker not in s: raise SystemExit('CSS marker not found')
          s = s.replace(marker, css, 1)

          new_render = r'''  renderCalculator(r){const c=this.data.calculator;return `<div class="grid"><div><div class="card"><h2>Расчёт</h2><div class="form"><div class="field"><label>Материал</label><select id="material">${this.data.materials.map(m=>`<option value="${m.id}" ${m.id===c.materialId?"selected":""}>${this.escape(m.name)}</option>`).join("")}</select></div><div class="field"><label>Принтер</label><select id="printer">${this.data.printers.map(p=>`<option value="${p.id}" ${p.id===c.printerId?"selected":""}>${this.escape(p.name)}</option>`).join("")}</select></div><div class="field"><label>Вес одного изделия, г</label><input id="weight" type="number" min="0" step="0.1" value="${c.weight}"></div><div class="field"><label>Количество, шт.</label><input id="quantity" type="number" min="1" step="1" value="${c.quantity}"></div><div class="field"><label>Время, часы</label><input id="hours" type="number" min="0" step="1" value="${c.hours}"></div><div class="field"><label>Время, минуты</label><input id="minutes" type="number" min="0" max="59" step="1" value="${c.minutes}"></div><div class="field"><label>📦 Упаковка, ₽ / шт.</label><input id="packaging" type="number" min="0" step="0.01" value="${c.packaging}"><div class="field-hint">Стоимость упаковки одного изделия. Итог = ставка × количество.</div></div><div class="field"><label>🛠 Постобработка, ₽ / шт.</label><input id="postProcessing" type="number" min="0" step="0.01" value="${c.postProcessing}"><div class="field-hint">Шлифовка, снятие поддержек, сборка и другая ручная обработка одного изделия.</div></div><div class="field"><label>👷 Работа, ₽ / шт.</label><input id="labor" type="number" min="0" step="0.01" value="${c.labor}"><div class="field-hint">Стоимость ручной работы на одно изделие.</div></div><div class="field full"><div class="explain">💡 Все три поля выше указываются <b>за одно изделие</b>. Например, 50 ₽ упаковки × 5 изделий = 250 ₽ в себестоимости заказа.</div></div><div class="field full"><label>Тип клиента</label><div class="choice-grid"><div class="choice"><input type="radio" name="customerType" id="customer-retail" value="retail" ${c.customerType==="retail"?"checked":""}><label for="customer-retail"><strong>🛍️ Розница</strong><span>Базовая наценка ${this.data.settings.commercial.retailMarkup}%</span></label></div><div class="choice"><input type="radio" name="customerType" id="customer-regular" value="regular" ${c.customerType==="regular"?"checked":""}><label for="customer-regular"><strong>⭐ Постоянный клиент</strong><span>Скидка ${this.data.settings.commercial.regularDiscount}%</span></label></div><div class="choice"><input type="radio" name="customerType" id="customer-wholesale" value="wholesale" ${c.customerType==="wholesale"?"checked":""}><label for="customer-wholesale"><strong>📦 Опт</strong><span>Скидка зависит от количества</span></label></div></div><label class="urgent-choice"><input id="urgent" type="checkbox" ${c.urgent?"checked":""}><span><b>⚡ Срочный заказ</b><br><span class="muted">Надбавка ${this.data.settings.commercial.urgentMarkup}%</span></span></label></div></div></div><div class="card"><h3>Себестоимость</h3><div class="cost-list"><div class="cost-line"><span>🧵 Материал <span class="meta">(${this.money(r.materialCost/r.q)} / шт.)</span></span><b id="cost-material">${this.money(r.materialCost)}</b></div><div class="cost-line"><span>🖨 Печать <span class="meta">(${this.money(r.machineCost/r.q)} / шт.)</span></span><b id="cost-machine">${this.money(r.machineCost)}</b></div><div class="cost-line"><span>📦 Упаковка <span class="meta">(${this.money(c.packaging)} / шт.)</span></span><b id="cost-packaging">${this.money(r.packagingCost)}</b></div><div class="cost-line"><span>🛠 Постобработка <span class="meta">(${this.money(c.postProcessing)} / шт.)</span></span><b id="cost-post">${this.money(r.postProcessingCost)}</b></div><div class="cost-line"><span>👷 Работа <span class="meta">(${this.money(c.labor)} / шт.)</span></span><b id="cost-labor">${this.money(r.laborCost)}</b></div></div><div class="cost-total"><span>Себестоимость заказа</span><span id="cost-total">${this.money(r.cost)}</span></div><div class="explain">Себестоимость — это реальные затраты до применения наценки, скидки, срочности и минимального заказа.</div></div></div><div class="result"><div class="card result-card"><h2>💰 Цена для клиента</h2><div class="price-hero"><div class="eyebrow">Итого за заказ · ${r.q} шт.</div><div class="price" id="sale-price">${this.money(r.salePrice)}</div><div class="per-unit">${this.money(r.salePricePerUnit)} за изделие</div></div><div class="summary"><div class="box"><span>Себестоимость</span><br><b id="cost">${this.money(r.cost)}</b></div><div class="box"><span>Прибыль</span><br><b id="profit" class="profit-positive">${this.money(r.profit)}</b></div><div class="box"><span>Цена / шт.</span><br><b id="sale-unit">${this.money(r.salePricePerUnit)}</b></div><div class="box"><span>Маржа</span><br><b id="margin">${r.margin.toFixed(1)}%</b></div></div><div class="result-section"><h3>📊 Как получилась цена</h3><div class="commercial"><div class="commercial-line"><span>Цена с базовой наценкой</span><span class="value">${this.money(r.retailBasePrice)}</span></div><div class="commercial-line"><span>${this.escape(r.discountLabel||"Скидка")}</span><span class="value">${r.discount?`−${this.money(r.discountAmount)}`:"0 ₽"}</span></div><div class="commercial-line"><span>⚡ Срочность</span><span class="value">${r.urgentMarkup?`+${r.urgentMarkup}% · ${this.money(r.urgentCost)}`:"Нет"}</span></div><div class="commercial-line"><span>Минимальный заказ</span><span class="value">${this.money(r.minimumOrder)}</span></div><div class="commercial-line"><span>Округление</span><span class="value">до ${this.money(this.data.settings.rounding)}</span></div></div>${r.minimumApplied?`<div class="minimum-note">ℹ️ Сработал минимальный заказ: расчётная цена была ниже ${this.money(r.minimumOrder)}, поэтому применена минимальная сумма.</div>`:""}</div><div class="result-section"><h3>📦 Заказ</h3><div class="commercial"><div class="commercial-line"><span>Количество</span><span class="value">${r.q} шт.</span></div><div class="commercial-line"><span>Материал</span><span class="value">${this.escape(r.material?.name||"")}</span></div><div class="commercial-line"><span>Принтер</span><span class="value">${this.escape(r.printer?.name||"")}</span></div><div class="commercial-line"><span>Вес с учётом отходов</span><span class="value">${r.totalEffectiveWeight.toFixed(1)} г</span></div></div></div><div class="actions copy-grid"><button class="primary" id="save-calc">💾 Сохранить</button><button id="print-calc">🖨 Печать / PDF</button><button id="copy-calc">📋 Полный расчёт</button><button id="copy-client-price">📄 Цена клиенту</button></div><div id="copy-status" class="notice status-inline" aria-live="polite"></div></div></div></div>`;}
  updateResult(){const r=this.calculate();const set=(id,text)=>{const e=this.querySelector(`#${id}`);if(e)e.textContent=text;};set("sale-price",this.money(r.salePrice));set("cost",this.money(r.cost));set("profit",this.money(r.profit));set("sale-unit",this.money(r.salePricePerUnit));set("margin",`${r.margin.toFixed(1)}%`);set("cost-material",this.money(r.materialCost));set("cost-machine",this.money(r.machineCost));set("cost-packaging",this.money(r.packagingCost));set("cost-post",this.money(r.postProcessingCost));set("cost-labor",this.money(r.laborCost));set("cost-total",this.money(r.cost));}
  bindCalculator(){const numeric=["weight","quantity","hours","minutes","packaging","postProcessing","labor"];numeric.forEach(id=>{const el=this.querySelector(`#${id}`);if(!el)return;el.addEventListener("input",()=>{this.data.calculator[id]=el.value;this.saveData();this.updateResult();});el.addEventListener("change",()=>{this.data.calculator[id]=el.value;this.saveData();this.updateResult();});});const m=this.querySelector("#material"),p=this.querySelector("#printer"),u=this.querySelector("#urgent");m.onchange=()=>{this.data.calculator.materialId=m.value;this.saveData();this.updateResult();};p.onchange=()=>{this.data.calculator.printerId=p.value;this.saveData();this.updateResult();};this.querySelectorAll("input[name=customerType]").forEach(e=>e.onchange=()=>{this.data.calculator.customerType=e.value;this.saveData();this.render();});u.onchange=()=>{this.data.calculator.urgent=u.checked;this.saveData();this.updateResult();};this.querySelector("#save-calc").onclick=()=>this.saveCalculation();this.querySelector("#print-calc").onclick=()=>this.printCalculation(this.calculate());this.querySelector("#copy-calc").onclick=()=>this.copy(this.textForResult(this.calculate()));this.querySelector("#copy-client-price").onclick=()=>this.copy(this.textForClient(this.calculate()));}
'''
          pattern = r'  renderCalculator\(r\)\{.*?\n  saveCalculation\(\)\{'
          if not re.search(pattern, s, re.S): raise SystemExit('calculator block not found')
          s = re.sub(pattern, new_render + '  saveCalculation(){', s, count=1, flags=re.S)
          s = s.replace('<div class="title">3D Калькулятор</div>', '<div class="title">3D Калькулятор <span class="muted" style="font-size:12px;font-weight:600">v1.6.0</span></div>', 1)
          js.write_text(s)

          Path('VERSION').write_text('1.6.0\n')
          changelog = Path('CHANGELOG.md')
          old = changelog.read_text() if changelog.exists() else ''
          entry = '''## 1.6.0\n\n- Redesigned calculator result block with clear commercial breakdown.\n- Added explicit explanations for packaging, post-processing and labor pricing per unit.\n- Improved client-price and full-calculation copy actions.\n- Preserved existing orders, history, materials, printers and calculator data.\n- Added visible frontend version marker for easier cache/debug verification.\n\n'''
          if not old.startswith('## 1.6.0'): changelog.write_text(entry + old)
          PY
          node --check hassio-3d-print-calculator.js
          grep -q '1.6.0' VERSION
          grep -q 'field-hint' hassio-3d-print-calculator.js
          grep -q 'Цена для клиента' hassio-3d-print-calculator.js
      - name: Commit 1.6.0
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hassio-3d-print-calculator.js VERSION CHANGELOG.md
          git commit -m 'build: 3d calculator v1.6.0'
          git push
